<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Site officiel de l'Ambassade de la Republique Democratique du Congo au Burundi, services consulaires a Bujumbura."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Ambassade RDC au Burundi | Services consulaires a Bujumbura</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ambardc-theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
